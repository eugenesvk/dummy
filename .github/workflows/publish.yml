name: Publish → crates.io
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
env:
  CARGO_TERM_COLOR: always
jobs:
  Publish:
    runs-on  : ubuntu-latest
    container:
      image  : rust:latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run : cargo install toml-cli
      - name: Check version (Cargo.toml = 🔖GitHub)
        run : test "$(toml get -r Cargo.toml package.version)" = "${{ github.ref_name }}"
      # - run : cargo publish
      #   env :
      #     CARGO_REGISTRY_TOKEN: ${{ secrets.Crates_Update_Token }}
# push    events: github.ref_name               = branch or tag that was pushed
# release events: github.event.release.tag_name = release tag
  #               github.ref_name might not always provide the expected value
# other triggers like pull_request, the variable behaves differently, often pointing to the merge branch or base branch
